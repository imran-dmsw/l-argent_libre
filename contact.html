<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — L'Argent Libre</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
:root { --ink: #1a1208; --muted: #5c5348; --cream: #f9f5ef; --gold: #c9952a; }
body { font-family: 'Lato', sans-serif; background: var(--cream); color: var(--ink); line-height: 1.75; padding: 2rem 1.5rem 4rem; max-width: 560px; margin: 0 auto; font-size: 0.95rem; }
h1 { font-family: 'Playfair Display', Georgia, serif; font-size: 1.75rem; margin-bottom: 0.5rem; }
.back { display: inline-block; margin-bottom: 2rem; color: var(--gold); font-weight: 700; text-decoration: none; font-size: 0.85rem; }
.back:hover { text-decoration: underline; }
p { margin-bottom: 1rem; color: var(--muted); }
a.mail { color: var(--gold); font-weight: 700; }
.box { background: rgba(26,18,8,0.04); border: 1px solid rgba(26,18,8,0.1); padding: 1.25rem 1.5rem; border-radius: 8px; margin-top: 1.5rem; }
</style>
</head>
<body>
<a class="back" href="index.html">← Retour au site</a>
<h1>Contact</h1>
<p>Pour toute question avant achat, problème de téléchargement après paiement ou demande liée à la garantie remboursement :</p>
<div class="box">
  <p style="margin:0"><strong>E-mail :</strong><br>
  <a class="mail" href="mailto:contact@example.com">contact@example.com</a></p>
</div>
<p style="font-size:0.85rem;margin-top:1.5rem">Remplacez <code>contact@example.com</code> par votre adresse réelle dans ce fichier et dans les autres pages légales.</p>
</body>
</html>
