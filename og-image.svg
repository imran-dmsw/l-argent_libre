<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">L'Argent Libre</title>
  <desc id="desc">Guide financier pour reprendre le controle de son argent</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1208"/>
      <stop offset="100%" stop-color="#2d5a3d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="60" y="60" width="1080" height="510" fill="none" stroke="#c9952a" stroke-opacity="0.45" stroke-width="2"/>
  <text x="100" y="210" fill="#e8c068" font-size="32" font-family="Georgia, serif" letter-spacing="4">GUIDE FINANCIER</text>
  <text x="100" y="320" fill="#f9f5ef" font-size="96" font-weight="700" font-family="Georgia, serif">L'Argent Libre</text>
